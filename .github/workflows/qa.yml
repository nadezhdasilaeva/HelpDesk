name: HelpDesk autotests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Unit, integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx jest tests/unit/core.test.js --runInBand

      - name: Integration tests
        run: npx jest tests/integration/api.test.js --runInBand

      - name: Start test server
        run: |
          nohup node -e 'require("./src/app")
            .createApp({ testMode: true })
            .listen(3000, "127.0.0.1")' > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              echo
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API (attempt $i/30)..."
            sleep 2
          done

          echo "API did not become ready within 60 seconds"
          cat server.log
          exit 1

      - name: Cypress E2E tests
        run: |
          npx cypress run \
            --spec "cypress/e2e/tickets.cy.js" \
            --config baseUrl=http://127.0.0.1:3000

      - name: Stop test server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Upload Cypress screenshots and server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-artifacts
          path: |
            cypress/screenshots/
            server.log
          if-no-files-found: ignore
